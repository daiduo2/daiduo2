name: Sync Featured Projects

on:
  # 每天北京时间凌晨 2:17 同步一次
  schedule:
    - cron: '17 18 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-projects.yml'

permissions:
  contents: write

# 防止与其它写 main 的 workflow 并发推送
concurrency:
  group: profile-readme-write
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    name: 同步精选项目区块
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 渲染精选项目区块
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const { owner } = context.repo;

            // 精选项目清单：顺序即主页展示顺序，改这里就能换项目
            const PINNED = [
              'geoseg',
              'solver-adapter',
              'generate-hypothesis-mcp',
              'local-proof-loop',
              'academic-trend-monitor',
              'academic-evolution-graph'
            ];

            // 技术标签的排序优先级：仓库 topics 是字母序，
            // 直接用会把最有辨识度的词排到后面，所以按这份优先级取前三个。
            const TAG_ORDER = [
              'specfem2d', 'geophysics', 'solver', 'seismic', 'knowledge-graph',
              'arxiv', 'openalex', 'bertopic', 'mcp', 'research', 'llm', 'lean',
              'ai4math', 'formal-verification', 'theorem-proving', 'agent',
              'multi-agent', 'dashboard', 'visualization', 'python', 'javascript',
              'typescript', 'go'
            ];

            const esc = (s) => String(s)
              .replace(/&/g, '&amp;')
              .replace(/</g, '&lt;')
              .replace(/>/g, '&gt;')
              .replace(/"/g, '&quot;');

            const blocks = [];
            for (const name of PINNED) {
              const res = await github.rest.repos.get({ owner: owner, repo: name });
              const d = res.data;

              const desc = esc(d.description || '');
              const lang = d.language || '';
              const topics = (d.topics || []).map(t => String(t).toLowerCase());

              const tags = [];
              if (lang) tags.push(lang);
              for (const t of TAG_ORDER) {
                if (tags.length >= 4) break;
                if (topics.includes(t) && !tags.some(x => x.toLowerCase() === t)) {
                  tags.push(t);
                }
              }
              const tagLine = tags.map(t => '`' + t + '`').join(' · ');

              const lines = [];
              lines.push('### [' + esc(name) + '](https://github.com/' + owner + '/' + name + ')');
              lines.push('');
              if (desc) {
                lines.push(desc);
                lines.push('');
              }
              if (tagLine) {
                lines.push(tagLine);
                lines.push('');
              }
              if (d.homepage) {
                lines.push('[在线演示](' + d.homepage + ')');
                lines.push('');
              }
              blocks.push(lines.join('\n'));
            }

            const BEGIN = '<!-- AUTO:PROJECTS:BEGIN -->';
            const END = '<!-- AUTO:PROJECTS:END -->';

            const readme = fs.readFileSync('README.md', 'utf8');
            const b = readme.indexOf(BEGIN);
            const e = readme.indexOf(END);
            if (b === -1 || e === -1 || e < b) {
              console.error('找不到自动生成区块标记，检查 README.md 是否保留了 ' + BEGIN + ' 与 ' + END);
              process.exit(1);
            }

            const block = BEGIN +
              '\n<!-- 本区块由 GitHub Actions 自动生成，请勿手动编辑 -->\n\n' +
              blocks.join('\n') +
              '\n' + END;

            fs.writeFileSync('README.md', readme.slice(0, b) + block + readme.slice(e + END.length));
            console.log('已同步 ' + PINNED.length + ' 个精选项目');

      - name: 提交变更
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          if git diff --staged --quiet; then
            echo "无变化，跳过提交"
          else
            git commit -m "chore: 同步精选项目区块"
            git push
          fi
